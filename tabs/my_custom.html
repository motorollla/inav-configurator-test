<!--suppress ALL -->
<div id="content-watermark"></div>
<div class="tab_my_custom toolbar_fixed_bottom">
	<style>
    #subtab-sensors {
        min-height: 400px;          /* чтобы не было нулевой высоты */
        visibility: visible !important;
        display: block !important;
    }
    #subtab-sensors .tab_sensors {
        padding: 10px;
        box-sizing: border-box;
    }
</style>
    <div id="my_custom-wrapper" class="content_wrapper">
        <div class="tab_title subtab__header">
            <span class="subtab__header_label subtab__header_label--current" for="subtab-osd">OSD</span>
            <span class="subtab__header_label" for="subtab-sensors">SENSORS</span>
        </div>

        <!-- Подвкладка OSD -->
        <div id="subtab-osd" class="subtab__content subtab__content--current">
            <!-- Сюда вставляем весь оригинальный контент OSD (без внешнего <div class="tab_osd">) -->
            <!-- Копируем из tabs/osd.html всё, что внутри <div class="tab_osd">...</div> -->
            <!-- Пример (реальный контент возьми из своего проекта): -->
            <div class="osd">
                <!-- OSD layout preview, elements list, font editor, alarms, etc. -->
                <div class="osd_preview_wrapper">
                    <!-- ... -->
                </div>
                <div class="osd_elements">
                    <!-- ... -->
                </div>
                <!-- Остальные блоки из оригинального osd.html -->
            </div>
        </div>

        <!-- Подвкладка SENSORS -->
        <div id="subtab-sensors" class="subtab__content">
            <!-- Сюда вставляем весь оригинальный контент SENSORS (без внешнего <div class="tab_sensors">) -->
            <!-- Копируем из tabs/sensors.html всё, что внутри <div class="tab_sensors">...</div> -->
            <!-- Пример: -->
            <div class="sensors">
                <div class="sensors_wrapper">
                    <!-- Графики, таблицы акселерометра, гироскопа, магнитометра и т.д. -->
                    <div class="sensors_acc">
                        <!-- ... -->
                    </div>
                    <!-- Остальные блоки из оригинального sensors.html -->
                </div>
            </div>
        </div>
    </div>

    <div class="clear-both"></div>
    <div id="my_custom-footer" class="content_toolbar">
        <!-- Можно добавить общие кнопки Save/Refresh, если нужно -->
        <div class="btn save_btn">
            <a class="update" href="#" data-i18n="commonSave">Save</a>
        </div>
        <div class="btn refresh_btn">
            <a class="refresh" href="#" data-i18n="commonRefresh">Refresh</a>
        </div>
    </div>
</div>
